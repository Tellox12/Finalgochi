name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test Finalgochi
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: >-
          xcodebuild
          -project Finalgochi.xcodeproj
          -scheme Finalgochi
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Run unit tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Using simulator $DEVICE_ID"
          xcodebuild \
            -project Finalgochi.xcodeproj \
            -scheme Finalgochi \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
