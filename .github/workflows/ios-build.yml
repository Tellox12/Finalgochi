name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile Finalgochi for iOS Simulator
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: >-
          xcodebuild
          -project Finalgochi.xcodeproj
          -scheme Finalgochi
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
